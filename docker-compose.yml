x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bot:
    build: .
    image: fraerish-bot
    env_file: .env
    environment:
      SEARXNG_URL: http://searxng:8080
      POSTGRES_HOST: postgres
    depends_on:
      searxng:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: fraerish
      POSTGRES_USER: fraerish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraerish -d fraerish"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  searxng:
    image: searxng/searxng:2026.11.13-219b63b20
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    logging: *logging

volumes:
  pg-data: