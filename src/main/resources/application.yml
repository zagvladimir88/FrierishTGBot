spring:
  application:
    name: fraerish-bot
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fraerish}
    username: ${POSTGRES_USER:fraerish}
    password: ${POSTGRES_PASSWORD}
  sql:
    init:
      mode: always
      encoding: UTF-8
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s

bot:
  token: ${BOT_TOKEN}
  name: ${BOT_NAME}
  polling-enabled: true
  digest:
    zone: Europe/Minsk
    zone-label: по Минску
    retry-window: 30m
    max-cities: 5
    max-currencies: 5
  weather-alerts:
    cron: "0 5 * * * *"
    active-from: "07:00"
    active-to: "22:00"
    lookahead: 3h
    min-chance: 0.5
  stats:
    weekly-cron: "0 0 20 * * SUN"
  video:
    enabled: true
    yt-dlp-path: yt-dlp
    timeout: 120s
    max-size: 50MB
    max-height: 720
    concurrency: 2

integration:
  open-weather:
    base-url: https://api.openweathermap.org
    api-key: ${OPEN_API_TOKEN}
  nbrb:
    base-url: https://api.nbrb.by
  binance:
    base-url: https://api.binance.com
  searxng:
    base-url: ${SEARXNG_URL:http://searxng:8080}
    candidates: 10
    max-images: 3
    safesearch: 1
  image-download:
    connect-timeout: 3s
    read-timeout: 5s
    total-timeout: 10s
    max-size: 10MB